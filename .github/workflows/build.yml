name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Sử dụng hành động chính thức để tự cấu hình Gradle mà không phụ thuộc file .jar bị thiếu
    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2'

    # Sử dụng trực tiếp lệnh 'gradle' của hệ thống thay vì './gradlew' cục bộ
    - name: Extract SHA-1 Fingerprint
      run: gradle signingReport

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sms-sync-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
